    en:
      title: "⚠️ Security incident: please update to 5.9.0 and replace your account secret"
      contents: |-
        On September 11, an attacker used a leaked database password to access Geph's account database and copied most of it, including the login details (account secrets) of all existing accounts. <b>No browsing history was exposed</b>, because Geph never stores it.<br><br>
        Anyone with your old account secret could log in to your account. Geph 5.9.0 will ask you to replace your secret, which locks the attacker out. Afterwards, log in on your other devices with the new secret.<br><br>
        Read the full <a href="https://community.geph.io/t/topic/22227" target="_blank" rel="noopener">incident report</a> for details. We're sorry for the trouble.<br><br>
        Download 5.9.0 from <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> or the <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">censorship-free mirror</a>.<br><br>
