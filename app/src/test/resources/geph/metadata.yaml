  - date: "2026-07-20"
    important: true
    en:
      title: "🎉 Version 5.8.0 released — background service, kill switch & tray icon"
      contents: |-
        5.8.0 is now available — one of our biggest releases since 5.0!<br><br>
        <b>Highlights</b><br>
        • New background-service architecture: the VPN engine now runs as a persistent system service, so closing the window no longer disconnects you and your tunnel comes back automatically after reboot — plus a new system tray icon on Windows, macOS, and Linux.<br>
        • VPN mode is now the default for new installs, protected by a fail-closed kill switch: if the tunnel drops, traffic stops — even if Geph itself crashes.<br>
        • VPN mode is now fully supported on macOS, and the Windows implementation was rewritten on top of WinTUN for faster speeds and lower CPU usage.<br>
        • Switch exit servers without disconnecting — on desktop, iOS, and Android alike — apply network settings while connected, and use IPv6 in VPN mode.<br>
        • Fixed stuck and truncated downloads, broken UDP in China-whitelist mode, and account secret display in RTL languages; the macOS build is now universal (Apple Silicon &amp; Intel).<br>
        • On mobile: settings reorganized to match the new desktop layout, an optional proxy toggle with in-app LAN addresses on Android, plus more reliable Plus purchases and stability fixes on iOS.<br><br>
        Download it from <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> or the <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">censorship-free mirror</a>.<br><br>
        <strong>Note:</strong> If you downloaded Geph from Google Play, please wait for the update to become available through the Play Store.
    zh-CN:
      title: "🎉 5.8.0 正式发布 — 后台服务架构、防泄漏开关与托盘图标"
      contents: |-
        5.8.0 现已发布——这是自 5.0 以来最大的更新之一！<br><br>
        <b>更新亮点</b><br>
        • 全新后台服务架构：VPN 核心作为常驻系统服务运行，关闭窗口不再断开连接，重启后隧道自动恢复——还新增了 Windows、macOS 和 Linux 上的系统托盘图标。<br>
        • 新安装默认启用 VPN 模式，并配备防泄漏开关（kill switch）：隧道断开时流量立即停止，即使程序本身崩溃也不会泄露。<br>
        • macOS 现已完整支持 VPN 模式；Windows 实现基于 WinTUN 重写，速度更快、CPU 占用更低。<br>
        • 不断线切换出口节点——桌面端、iOS、Android 均支持；网络设置即时生效，VPN 模式支持 IPv6。<br>
        • 修复下载卡住和中断、中国白名单模式下的 UDP 失效，以及从右到左语言下的账户密钥显示问题；macOS 安装包现为通用版本（Apple Silicon 与 Intel）。<br>
        • 移动端：iOS 与 Android 设置页与桌面端新布局一致；Android 代理变为可选开关并显示局域网 IP；iOS Plus 购买更可靠，并修复多个稳定性问题。<br><br>
        前往 <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> 或 <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">免翻墙镜像</a> 下载。<br><br>
        <strong>注意：</strong>如果您是从 Google Play 下载的迷雾通，请等待 Play 商店的更新推送。
