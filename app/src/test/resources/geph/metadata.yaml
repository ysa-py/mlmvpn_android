        هر کسی که رمز قدیمی حساب شما را داشته باشد می‌تواند وارد حساب شما شود. Geph ۵.۹.۰ از شما می‌خواهد رمز خود را عوض کنید تا دسترسی آن‌ها قطع شود. پس از آن، در دستگاه‌های دیگر خود با رمز جدید وارد شوید.<br><br>
