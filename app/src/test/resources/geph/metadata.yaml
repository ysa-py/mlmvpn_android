    ru:
      title: "🎉 Выпущена версия 5.8.0 — фоновая служба, kill switch и значок в трее"
      contents: |-
        5.8.0 уже доступна — один из крупнейших релизов со времён 5.0!<br><br>
        <b>Главные изменения</b><br>
        • Новая архитектура фоновой службы: движок VPN теперь работает как постоянная системная служба, поэтому закрытие окна больше не разрывает соединение, а туннель автоматически восстанавливается после перезагрузки — плюс новый значок в системном трее на Windows, macOS и Linux.<br>
        • Режим VPN теперь включён по умолчанию для новых установок и защищён fail-closed kill switch: если туннель обрывается, трафик останавливается — даже если сам Geph аварийно завершился.<br>
        • Режим VPN теперь полностью поддерживается на macOS, а реализация для Windows переписана на основе WinTUN для более высокой скорости и меньшей нагрузки на CPU.<br>
        • Переключайте выходные серверы без отключения — на десктопе, iOS и Android — применяйте сетевые настройки без переподключения и используйте IPv6 в режиме VPN.<br>
        • Исправлены зависшие и обрывающиеся загрузки, неработающий UDP в режиме китайского белого списка и отображение секрета аккаунта в языках с письмом справа налево; сборка для macOS теперь универсальная (Apple Silicon и Intel).<br>
        • На мобильных: настройки реорганизованы в соответствии с новым десктопным макетом; на Android локальный прокси стал опциональным переключателем с отображением LAN-адресов в приложении; на iOS — более надёжные покупки Plus и исправления стабильности.<br><br>
        Скачайте на <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> или с <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">зеркала, устойчивого к цензуре</a>.<br><br>
