    es:
      title: "⚠️ Incidente de seguridad: actualiza a 5.9.0 y reemplaza tu secreto de cuenta"
      contents: |-
        El 11 de septiembre, un atacante usó una contraseña de base de datos filtrada para acceder a la base de datos de cuentas de Geph y copió la mayor parte, incluidos los datos de inicio de sesión (secretos de cuenta) de todas las cuentas existentes. <b>No se expuso ningún historial de navegación</b>, porque Geph nunca lo almacena.<br><br>
