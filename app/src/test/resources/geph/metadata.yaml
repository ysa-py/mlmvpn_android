        • حالت VPN اکنون برای نصب‌های جدید پیش‌فرض است و با کلید قطع اضطراری (kill switch) از نوع fail-closed محافظت می‌شود: اگر تونل قطع شود، ترافیک متوقف می‌شود — حتی اگر خود Geph از کار بیفتد.<br>
        • حالت VPN اکنون در macOS به‌طور کامل پشتیبانی می‌شود و پیاده‌سازی Windows بر پایهٔ WinTUN بازنویسی شده تا سرعت بالاتر و مصرف CPU کمتری داشته باشد.<br>
        • سرورهای خروجی را بدون قطع اتصال عوض کنید — در دسکتاپ، iOS و Android — تنظیمات شبکه را در حین اتصال اعمال کنید و در حالت VPN از IPv6 استفاده کنید.<br>
        • دانلودهای گیرکرده و ناقص، خرابی UDP در حالت فهرست سفید چین و نمایش رمز حساب در زبان‌های راست‌به‌چپ برطرف شد؛ بستهٔ macOS اکنون یونیورسال است (Apple Silicon و Intel).<br>
        • در موبایل: تنظیمات مطابق چیدمان جدید دسکتاپ بازآرایی شده؛ در Android پراکسی محلی به گزینه‌ای اختیاری با نمایش آدرس‌های LAN در برنامه تبدیل شده؛ و در iOS خریدهای Plus قابل‌اعتمادتر شده و چند مشکل پایداری برطرف شده است.<br><br>
        از <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> یا <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">آینهٔ مقاوم به فیلترینگ</a> دانلود کنید.<br><br>
        <strong>توجه:</strong> اگر Geph را از Google Play دریافت کرده‌اید، لطفاً منتظر در دسترس قرار گرفتن به‌روزرسانی در فروشگاه بمانید.
    es:
      title: "🎉 Versión 5.8.0 publicada — servicio en segundo plano, kill switch e icono de bandeja"
      contents: |-
        ¡5.8.0 ya está disponible — una de nuestras mayores versiones desde la 5.0!<br><br>
        <b>Destacados</b><br>
        • Nueva arquitectura de servicio en segundo plano: el motor VPN ahora se ejecuta como un servicio persistente del sistema, así que cerrar la ventana ya no te desconecta y el túnel vuelve automáticamente tras reiniciar — además de un nuevo icono en la bandeja del sistema en Windows, macOS y Linux.<br>
        • El modo VPN ahora es el predeterminado en instalaciones nuevas, protegido por un kill switch fail-closed: si el túnel se cae, el tráfico se detiene — incluso si Geph mismo falla.<br>
        • El modo VPN ahora es totalmente compatible con macOS, y la implementación de Windows se reescribió sobre WinTUN para mayor velocidad y menor uso de CPU.<br>
        • Cambia de servidor de salida sin desconectarte — en escritorio, iOS y Android por igual — aplica los ajustes de red mientras estás conectado y usa IPv6 en modo VPN.<br>
        • Se corrigieron descargas atascadas y truncadas, el UDP roto en el modo de lista blanca de China y la visualización del secreto de cuenta en idiomas RTL; la versión de macOS ahora es universal (Apple Silicon e Intel).<br>
        • En móvil: ajustes reorganizados según el nuevo diseño de escritorio; en Android el proxy local ahora es un interruptor opcional con las direcciones LAN visibles en la app; y en iOS, compras de Plus más fiables y varias correcciones de estabilidad.<br><br>
        Descárgala desde <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> o desde el <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">espejo anticensura</a>.<br><br>
        <strong>Nota:</strong> Si descargaste Geph desde Google Play, espera a que la actualización aparezca en la tienda.
    uk:
      title: "🎉 Випущено 5.8.0 — фонова служба, kill switch та значок у треї"
      contents: |-
        5.8.0 вже доступна — один із найбільших релізів від часів 5.0!<br><br>
        <b>Основні зміни</b><br>
        • Нова архітектура фонової служби: рушій VPN тепер працює як постійна системна служба, тому закриття вікна більше не розриває з'єднання, а тунель автоматично відновлюється після перезавантаження — плюс новий значок у системному треї на Windows, macOS і Linux.<br>
        • Режим VPN тепер увімкнено за замовчуванням для нових встановлень і захищено fail-closed kill switch: якщо тунель обривається, трафік зупиняється — навіть якщо сам Geph аварійно завершився.<br>
        • Режим VPN тепер повністю підтримується на macOS, а реалізацію для Windows переписано на основі WinTUN для вищої швидкості та меншого навантаження на CPU.<br>
        • Перемикайте вихідні сервери без відключення — на десктопі, iOS та Android — застосовуйте мережеві налаштування без перепідключення та використовуйте IPv6 у режимі VPN.<br>
        • Виправлено завислі та обірвані завантаження, непрацюючий UDP у режимі китайського білого списку та відображення секрету акаунта в мовах із письмом справа наліво; збірка для macOS тепер універсальна (Apple Silicon та Intel).<br>
        • На мобільних: налаштування реорганізовано відповідно до нового десктопного макета; на Android локальний проксі став опціональним перемикачем із відображенням LAN-адрес у застосунку; на iOS — надійніші покупки Plus і виправлення стабільності.<br><br>
        Завантажте з <a href="https://geph.io" target="_blank" rel="noopener">geph.io</a> або з <a href="https://waa.ai/xiazaimiwutong" target="_blank" rel="noopener">дзеркала, стійкого до цензури</a>.<br><br>
        <strong>Примітка:</strong> якщо ви завантажили Geph з Google Play, зачекайте появи оновлення в Play Store.
