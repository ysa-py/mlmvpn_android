      contents: |-
        11 сентября злоумышленник, воспользовавшись попавшим в открытый доступ паролем от базы данных, получил доступ к базе аккаунтов Geph и скопировал бо́льшую её часть, включая данные для входа (секретные ключи) всех существующих аккаунтов. <b>История посещений не раскрыта</b>, поскольку Geph её никогда не хранит.<br><br>
        Любой, у кого есть ваш старый секретный ключ, может войти в ваш аккаунт. Geph 5.9.0 предложит заменить ключ — после этого у посторонних больше не будет доступа. Затем войдите на других устройствах с новым ключом.<br><br>
