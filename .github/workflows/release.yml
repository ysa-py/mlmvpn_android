name: Release APKs

on:
  push:
    tags:
      - 'v*'
    # TEMPORARY (verification only, removed before merge): run the build on this session branch.
    branches:
      - arena/7af180d9-mlmvpn-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned rather than `ubuntu-latest`: GitHub moves `ubuntu-latest` to Ubuntu 26 on 2026-10-19,
    # and an unannounced image change is the last thing a release build should depend on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The native cores in app/src/main/jniLibs/ and the tunnel cores are Git LFS objects
          # (see .gitattributes). Without LFS the checkout leaves their 132-byte pointer files in
          # place, and those get packaged into the APK as if they were the libraries.
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          # The build runs Node scripts (checkWorkerAsset, testWorker). testWorker imports
          # `node:sqlite`, which needs Node 22.13 or newer.
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Installed explicitly, so the build does not depend on what the image or AGP fetches
          # at runtime: compileSdk 34 and buildToolsVersion 35.0.0 from app/build.gradle.
          # The v3 default also asked for the obsolete `tools` package, which the SDK repository
          # no longer serves ("Failed to find package 'tools'"), and that failed the job.
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'

      - name: Adapt gradle.properties for this runner
        run: |
          # gradle.properties holds settings for the maintainer's Windows PC: a SOCKS proxy on
          # 127.0.0.1:10808, the Android Studio JDK under C:/Program Files, and a C:\ temp dir.
          # None of them exist on this runner, and the proxy would refuse every download.
          # The 2 GB daemon heap is too small for R8 (release shrinking) on the native cores:
          # the build died with OutOfMemoryError in R8Task. The runner has 16 GB, so it gets 5 GB.
          # Only this runner's checkout is changed. The committed file is left as it is, so the
          # Windows build keeps its settings.
          sed -i -E \
            -e '/^systemProp\.socks/d' \
            -e '/^org\.gradle\.java\.home=/d' \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            -e 's/ -Djdk\.net\.unixdomain\.tmpdir=[^ ]*//' \
            -e 's/-Xmx[0-9]+[mMgG]/-Xmx5g/' \
            gradle.properties
          echo "gradle.properties as used on this runner:"
          cat gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APKs
        run: |
          set -o pipefail
          chmod +x gradlew
          # TEMP DIAGNOSTICS (remove with the trigger): keep the build output for the reporting step.
          { echo "JAVA_HOME=$JAVA_HOME"; which java; java -version 2>&1; ls -la gradlew gradle/wrapper; sha256sum gradle/wrapper/gradle-wrapper.jar; } > /tmp/diag.txt 2>&1 || true
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: TEMP report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### TEMP diagnostics'; echo '```'; cat /tmp/diag.txt 2>/dev/null; echo '```'; echo '### what went wrong'; echo '```'; grep -n -A14 'What went wrong' /tmp/build.log 2>/dev/null | head -c 12000; echo '```'; echo '### build tail'; echo '```'; tail -c 20000 /tmp/build.log 2>/dev/null || echo 'no build log'; echo '```'; } > /tmp/body.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/body.md --jq '.html_url'

      - name: TEMP verify APKs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/verify.md
          import glob, zipfile, os
          print('### TEMP APK verification')
          for apk in sorted(glob.glob('app/build/outputs/apk/**/*.apk', recursive=True)):
              print('```')
              print(f'{apk}  {os.path.getsize(apk)} bytes')
              z = zipfile.ZipFile(apk)
              names = z.namelist()
              print('dex files:', sum(1 for n in names if n.startswith('classes') and n.endswith('.dex')))
              for n in names:
                  if n.endswith('.so'):
                      info = z.getinfo(n)
                      is_elf = z.read(n)[:4] == b'\x7fELF'
                      print('  ' + n + '  ' + str(info.file_size) + ' bytes  ELF=' + str(is_elf))
              print('```')
          PY
          cat /tmp/verify.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/verify.md --jq '.html_url'

      - name: Rename APKs
        run: |
          ls -la app/build/outputs/apk/release/ 2>&1 | head -n 20
          find app/build/outputs/apk -name "*.apk" -type f | while read f; do echo "found: $f"; done

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Upload APKs (abi splits)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-splits
          path: app/build/outputs/apk/**/release/*.apk
